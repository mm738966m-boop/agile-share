    const page=document.getElementById('page');page.innerHTML=new TextDecoder().decode(buf);

    for(const old of page.querySelectorAll('script')){const ty=(old.type||'').toLowerCase();if(ty&&!/javascript|module/.test(ty))continue;const s=document.createElement('script');for(const a of old.attributes)s.setAttribute(a.name,a.value);if(old.src){s.async=false;await new Promise(r=>{s.onload=s.onerror=r;old.replaceWith(s)})}else{s.textContent=old.textContent;old.replaceWith(s)}}
    try{localStorage.setItem('k'+location.pathname,pw)}catch(e){}
    return true;
  }catch(e){return false}}
