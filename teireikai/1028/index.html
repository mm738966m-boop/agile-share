  try{const k=localStorage.getItem('k'+location.pathname);if(k&&!tries.includes(k))tries.push(k)}catch(e){}
  for(const pw of tries){if(await open_(pw))return}
  msg.textContent='LINEでお送りしたリンクから開いてください。開けないときは森川までご連絡ください。';
})();
</script>
